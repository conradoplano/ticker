# Compose file for the Synology NAS (Container Manager → Project → Create →
# "Create docker-compose.yml" and paste this). Fill in the values below;
# they only live on the NAS, never in git.
#
# Image built by .github/workflows/docker.yml on every push to main.
services:
  ticker:
    image: ghcr.io/conradoplano/ticker:latest
    # Always fetch the newest image when the project is built/started.
    pull_policy: always
    container_name: ticker
    restart: unless-stopped
    ports:
      # Only reachable from the NAS itself; DSM's reverse proxy serves it over HTTPS.
      - "127.0.0.1:5063:8000"
    volumes:
      # Database. Relative to the project folder, e.g. /docker/ticker/data. Back this up.
      # Synology doesn't create missing folders: create "data" in File Station first.
      - ./data:/data
    environment:
      # python -c "import secrets; print(secrets.token_urlsafe(50))"
      SECRET_KEY: "change-me"
      DEBUG: "false"
      ALLOWED_HOSTS: "ticker.example.com,localhost,127.0.0.1"
      CSRF_TRUSTED_ORIGINS: "https://ticker.example.com"
      BEHIND_PROXY: "true"
      SECURE_COOKIES: "true"
      TIME_ZONE: "Europe/Berlin"
      SITE_NAME: "Ticker"
      # Created/updated as admin on every start (optional)
      INITIAL_ADMIN_EMAIL: ""
      # SMTP for login codes
      EMAIL_HOST: "smtp.example.com"
      EMAIL_PORT: "587"
      EMAIL_HOST_USER: ""
      EMAIL_HOST_PASSWORD: ""
      EMAIL_USE_TLS: "true"
      DEFAULT_FROM_EMAIL: "Ticker <ticker@example.com>"
      LOGIN_CODE_MAX_AGE: "600"
      # AI for ranking, setup, briefing and learning (platform.openai.com/api-keys); empty: ranked by topic keywords
      OPENAI_API_KEY: ""
      AI_MODEL: "gpt-5.4-mini"
      AI_EFFORT: "low"
      # What AI may cost per day in USD: per person (changeable per person on the admin page) and in total
      AI_DAILY_LIMIT_USD: "0.10"
      AI_GLOBAL_DAILY_LIMIT_USD: "1.00"
      # Free AI for new people before approval: hours, USD per person, USD per day for all new people together
      AI_TRIAL_HOURS: "24"
      AI_TRIAL_LIMIT_USD: "0.10"
      AI_TRIAL_GLOBAL_DAILY_LIMIT_USD: "0.50"
      # Anyone can register; "false": only with adduser
      REGISTRATION_OPEN: "true"
      # Address of the app for links in emails (default: the first CSRF_TRUSTED_ORIGINS entry)
      SITE_URL: ""
      # Background fetching and refreshing inside this container
      RUN_SCHEDULER: "true"
      # Articles older than this are deleted unless someone saved them
      ARTICLE_MAX_AGE_DAYS: "30"
