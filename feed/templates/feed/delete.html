{% extends "base.html" %}
{% block content %}
  <div class="card narrow">
    <h2>Delete your account</h2>
    <p>This deletes your sources, topics, ratings and learned profile. It cannot be undone. You can <a href="{% url 'feed:export' %}">export your data</a> first.</p>
    <form method="post" class="stack">
      {% csrf_token %}
      <div class="field"><label for="email">Type your email address to confirm</label><input id="email" type="email" name="email" autocomplete="off"></div>
      <button class="danger wide">Delete my account</button>
    </form>
    <p class="center"><a href="{% url 'feed:settings' %}">Cancel</a></p>
  </div>
{% endblock %}
