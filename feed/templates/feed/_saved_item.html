{% load feed_tags %}
<article class="card item{% if article.id in opened %} read{% endif %}" id="saved-{{ article.id }}">
  <div>
    <h3><a href="{% url 'feed:open' article.id %}" target="_blank" rel="noopener">{{ article.title }}</a></h3>
    <div class="meta"><span>{{ article.source_name }}</span><span>·</span><span>{{ article.published_at|ago }}</span></div>
  </div>
  {% if article.image_url %}<img class="thumb" src="{{ article.image_url }}" alt="" loading="lazy" referrerpolicy="no-referrer">{% endif %}
  {% if article.one_line %}<p class="why">{{ article.one_line }}</p>{% endif %}
  <div class="actions">
    <form method="post" action="{% url 'feed:rate' article.id %}" hx-post="{% url 'feed:rate' article.id %}" hx-target="#saved-{{ article.id }}" hx-swap="outerHTML" class="inline">
      {% csrf_token %}<input type="hidden" name="where" value="saved"><input type="hidden" name="next" value="{% url 'feed:saved' %}">
      <button name="value" value="read">{% if article.id in opened %}↺ Mark as unread{% else %}✓ Mark as read{% endif %}</button>
      <button name="value" value="saved">Remove</button>
    </form>
  </div>
</article>
